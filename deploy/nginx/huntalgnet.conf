server {
    listen __HTTP_LISTEN__;
    listen __HTTP_LISTEN6__;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen __HTTPS_LISTEN__ ssl http2;
    listen __HTTPS_LISTEN6__ ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HuntAlgNet:10m;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    server_tokens off;
    client_max_body_size 512M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_conn huntalgnet_conn 20;
    limit_req zone=huntalgnet_api burst=40 nodelay;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=huntalgnet_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/huntalgnet-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/huntalgnet-proxy.conf;
    }
}
